name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The rep/fault logic is pure, so it costs seconds to prove it before shipping an APK.
      - run: npm test

      # Pulls the MediaPipe wasm out of node_modules and downloads the pose model.
      # www/vendor/ is gitignored, so this is what puts it in the build.
      - run: npm run vendor

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK with licences already accepted.
      - run: npx cap sync android

      # The exec bit does not survive a checkout of a repo authored on Windows.
      - run: chmod +x android/gradlew

      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - uses: actions/upload-artifact@v4
        with:
          name: trainer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
