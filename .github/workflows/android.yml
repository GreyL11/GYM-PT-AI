name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    # Needed to publish the release below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The rep/fault logic is pure, so it costs seconds to prove it before shipping an APK.
      - run: npm test

      # Pulls the MediaPipe wasm out of node_modules and downloads the pose model.
      # www/vendor/ is gitignored, so this is what puts it in the build.
      - run: npm run vendor

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK with licences already accepted.
      - run: npx cap sync android

      # The exec bit does not survive a checkout of a repo authored on Windows.
      - run: chmod +x android/gradlew

      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # A release asset, not a build artifact: artifacts are a zip and need a signed-in GitHub
      # session, which is useless on a phone. A release asset is a direct one-tap APK download.
      # `gh` is preinstalled on the runner, so this needs no third-party action.
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk you.apk
          gh release create "build-${{ github.run_number }}" you.apk \
            --title "You build ${{ github.run_number }}" \
            --notes "Debug APK. Download you.apk below, tap to install. Always newest: /releases/latest"
