<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131313">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trainer</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<style>
  /* Design tokens from the Stitch export (trainer/DESIGN.md). Plain CSS, not Tailwind — the
     CDN build would leave the APK blank with no signal. */
  :root {
    --bg: #131313;
    --sc-lowest: #0e0e0e;
    --sc-low: #1c1b1b;
    --sc: #201f1f;
    --sc-high: #2a2a2a;
    --sc-highest: #353534;
    --on-surface: #e5e2e1;
    --on-surface-variant: #baccb0;
    --outline-variant: #3c4b35;
    --neon: #39ff14;
    --on-neon: #0a0a0a;
    --danger: #c5020c;
    --on-danger: #ffdad6;

    --touch: 64px;
    --gutter: 16px;
    --margin: 20px;
    --stack: 24px;

    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);

    --sans: Inter, system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    background: var(--bg); color: var(--on-surface); font: 500 20px/28px var(--sans);
    -webkit-user-select: none; user-select: none; overflow: hidden;
  }

  /* Mono is for anything you read as an instrument: reps, weights, timers, angles. */
  .data { font: 700 16px/20px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
  .hero { font: 900 56px/52px var(--sans); letter-spacing: -.04em; text-transform: uppercase; }
  .headline { font: 800 32px/36px var(--sans); letter-spacing: -.02em; text-transform: uppercase; }

  #stage { position: fixed; inset: 0; }
  #cam, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #cam { background: #000; }

  /* ── live session HUD ────────────────────────────────────────────────────────────────── */
  .hud { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; }
  .hud > * { pointer-events: auto; }

  #top {
    display: flex; align-items: flex-start; gap: var(--gutter);
    padding: calc(var(--safe-t) + 20px) var(--margin) 16px;
    background: linear-gradient(#131313e6, transparent);
  }
  #exname { flex: 1; text-shadow: 0 2px 12px #000; }
  #setinfo {
    display: inline-block; margin-top: 8px; padding: 8px 14px;
    background: #2a2a2acc; border: 1px solid var(--outline-variant); border-radius: 2px;
    backdrop-filter: blur(4px); color: var(--neon);
  }
  #btn-settings {
    height: var(--touch); padding: 0 22px; background: transparent;
    border: 2px solid var(--neon); color: var(--neon); border-radius: 2px;
  }

  #reps {
    position: absolute; right: var(--margin); top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center;
  }
  #repnum {
    font: 900 84px/80px var(--mono); color: var(--neon); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 15px rgba(57, 255, 20, .4);
  }
  #reptarget { margin-top: 8px; color: var(--on-surface-variant); letter-spacing: .18em; }

  #cue {
    margin: auto var(--margin) 0; padding: 18px; border-radius: 2px;
    background: var(--danger); color: #fff; font-weight: 800; font-size: 22px; line-height: 28px;
    text-align: center; opacity: 0; transition: opacity .18s;
  }
  #cue.show { opacity: 1; }

  #status {
    margin: 10px var(--margin) 0; text-align: center; min-height: 20px;
    color: var(--on-surface-variant); font: 700 13px/20px var(--mono); letter-spacing: .05em;
  }

  #bottom {
    display: flex; gap: 12px; padding: 16px var(--margin) calc(var(--safe-b) + 20px);
    background: linear-gradient(transparent, #131313e6 45%);
  }

  /* ── buttons ─────────────────────────────────────────────────────────────────────────── */
  button {
    flex: 0 0 auto; min-height: var(--touch); padding: 0 20px; border: 0; border-radius: 2px;
    background: var(--sc-highest); color: var(--on-surface);
    font: 700 16px/20px var(--mono); letter-spacing: .05em; text-transform: uppercase;
    transition: transform .1s;
  }
  button:active { transform: scale(.97); }
  button.primary { background: var(--neon); color: var(--on-neon); }
  button:disabled { opacity: .4; }
  #bottom button { flex: 1; }

  /* ── sheets ──────────────────────────────────────────────────────────────────────────── */
  .sheet {
    position: absolute; inset: 0; z-index: 5; background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet[hidden] { display: none; }
  .sheet header {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    height: var(--touch); flex: 0 0 auto; padding: 0 var(--margin);
    margin-top: var(--safe-t); border-bottom: 1px solid var(--outline-variant);
  }
  .sheet header .brand {
    font: 900 32px/36px var(--sans); font-style: italic; letter-spacing: -.05em;
    text-transform: uppercase; color: var(--neon);
  }
  .sheet header button { min-height: 44px; padding: 0 10px; background: none; color: var(--neon); }
  .sheet .body {
    flex: 1; overflow-y: auto; padding: var(--stack) var(--margin);
    display: flex; flex-direction: column; gap: var(--stack);
  }
  .sheet .foot {
    flex: 0 0 auto; display: flex; gap: 12px; padding: 16px var(--margin) calc(var(--safe-b) + 20px);
    border-top: 1px solid var(--outline-variant); background: var(--sc);
  }
  .sheet .foot button { flex: 1; }
  .muted { color: var(--on-surface-variant); margin: 0; }

  /* ── picker ──────────────────────────────────────────────────────────────────────────── */
  #groups {
    flex: 0 0 auto; display: flex; gap: 12px; overflow-x: auto; padding: 16px var(--margin);
    scrollbar-width: none;
  }
  #groups::-webkit-scrollbar { display: none; }
  #groups button {
    min-height: 56px; border-radius: 999px; background: transparent;
    border: 1px solid var(--outline-variant); color: var(--on-surface-variant); white-space: nowrap;
  }
  #groups button[aria-pressed="true"] { background: var(--neon); border-color: var(--neon); color: var(--on-neon); }

  #exlist { flex: 1; overflow-y: auto; padding: 0 var(--margin); }
  #exlist button, .exlist button {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; padding: 0; background: none; border-bottom: 1px solid var(--outline-variant);
    border-radius: 0; text-align: left;
  }
  #exlist .nm, .exlist .nm { font: 700 20px/28px var(--sans); text-transform: none; letter-spacing: 0; }
  #exlist .meta, .exlist .meta { color: var(--on-surface-variant); }
  .exlist button.done .nm { color: var(--on-surface-variant); text-decoration: line-through; }
  .exlist button.done .meta { color: var(--neon); }

  .chips.wrap { flex-wrap: wrap; overflow: visible; padding: 0; }
  .fieldlabel {
    display: block; margin-bottom: 12px; color: var(--on-surface-variant);
    font: 800 20px/24px var(--sans); text-transform: uppercase; letter-spacing: -.01em;
  }
  .chips.wrap button {
    min-height: 56px; border-radius: 999px; background: transparent;
    border: 1px solid var(--outline-variant); color: var(--on-surface-variant); white-space: nowrap;
  }
  .chips.wrap button[aria-pressed="true"] { background: var(--neon); border-color: var(--neon); color: var(--on-neon); }

  #picker-controls {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 16px;
    padding: 20px var(--margin) calc(var(--safe-b) + 20px);
    border-top: 1px solid var(--outline-variant); background: var(--sc);
  }
  /* segmented camera control */
  #facing { display: flex; height: var(--touch); background: var(--sc-highest); border-radius: 8px; padding: 4px; }
  #facing button { flex: 1; min-height: auto; background: none; color: var(--on-surface-variant); border-radius: 6px; }
  #facing button[aria-pressed="true"] { background: var(--neon); color: var(--on-neon); }

  /* voice switch — a real checkbox, restyled, so the label and keyboard still work */
  .switch {
    display: flex; align-items: center; justify-content: space-between; height: var(--touch);
    padding: 0 18px; border: 1px solid var(--outline-variant); border-radius: 8px; background: var(--sc);
  }
  .switch span { font: 700 16px/20px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
  .switch input { appearance: none; margin: 0; width: 72px; height: 40px; border-radius: 999px;
    background: var(--sc-highest); position: relative; transition: background .15s; }
  .switch input:checked { background: #1a3a10; box-shadow: 0 0 20px rgba(57, 255, 20, .2); }
  .switch input::after {
    content: ''; position: absolute; top: 4px; left: 4px; width: 32px; height: 32px;
    border-radius: 999px; background: var(--sc-bright, #6b6b6b); transition: transform .15s, background .15s;
  }
  .switch input:checked::after { background: var(--neon); transform: translateX(32px); }

  /* ── setup ───────────────────────────────────────────────────────────────────────────── */
  .hintcard {
    display: flex; gap: 12px; padding: 16px; background: var(--sc-high);
    border: 1px solid #333; border-radius: 2px; color: var(--on-surface-variant);
    font: 700 14px/20px var(--mono); letter-spacing: .03em;
  }
  .stepper { background: var(--sc-high); border: 1px solid #333; border-radius: 4px; padding: 8px; }
  .stepper > label {
    display: block; padding: 0 8px 8px; color: var(--on-surface-variant);
    font: 800 20px/24px var(--sans); text-transform: uppercase; letter-spacing: -.01em;
  }
  .stepper .ctl { display: flex; align-items: stretch; height: 84px; background: var(--bg); border-radius: 2px; }
  .stepper .ctl button {
    width: 76px; min-height: auto; background: none; color: var(--neon); font: 700 32px/1 var(--mono);
  }
  .stepper input {
    flex: 1; width: 100%; min-width: 0; border: 0; background: transparent; color: var(--on-surface);
    text-align: center; font: 900 40px/1 var(--mono); font-variant-numeric: tabular-nums;
    appearance: textfield;
  }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button {
    appearance: none; margin: 0;
  }
  .stepper input:focus { outline: none; box-shadow: inset 0 -2px 0 var(--neon); }

  /* ── rest ────────────────────────────────────────────────────────────────────────────── */
  #sheet-rest .body { align-items: center; justify-content: center; text-align: center; }
  #resttime {
    font: 900 84px/80px var(--mono); color: var(--neon); font-variant-numeric: tabular-nums;
    text-shadow: 0 0 24px rgba(57, 255, 20, .35);
  }
  #restbar { width: 200px; height: 12px; background: #262626; border-radius: 999px; overflow: hidden; }
  #restfill { height: 100%; width: 100%; background: var(--neon); transition: width 1s linear; }

  /* ── progress ────────────────────────────────────────────────────────────────────────── */
  .card { background: #1a1a1a; border: 1px solid #333; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; font: 800 22px/26px var(--sans); text-transform: uppercase; letter-spacing: -.02em; }
  .card .line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .card .k { color: var(--on-surface-variant); font: 700 13px/18px var(--mono); letter-spacing: .05em; text-transform: uppercase; }
  .card .v { font: 700 18px/22px var(--mono); font-variant-numeric: tabular-nums; }
  .up { color: var(--neon); }
  .flat { color: var(--on-surface-variant); }
  .warn { color: #ffb4ab; }

  .bar { display: flex; align-items: center; gap: 12px; }
  .bar .name { width: 92px; flex: 0 0 auto; font: 700 13px/18px var(--mono); text-transform: uppercase; color: var(--on-surface-variant); }
  .bar .track { flex: 1; height: 12px; background: #262626; border-radius: 999px; overflow: hidden; position: relative; }
  .bar .fill { height: 100%; background: var(--neon); }
  .bar .fill.under { background: #6b6b6b; }
  .bar .fill.over { background: #ffb4ab; }
  .bar .n { width: 34px; text-align: right; font: 700 14px/18px var(--mono); font-variant-numeric: tabular-nums; }

  /* ── adjust ──────────────────────────────────────────────────────────────────────────── */
  #sliders { display: flex; flex-direction: column; gap: var(--stack); }
  .slider { background: #1a1a1a; border: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .slider .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .slider label { font: 500 17px/22px var(--sans); text-transform: uppercase; letter-spacing: .04em; }
  .slider output {
    min-width: 84px; text-align: center; padding: 8px 12px; background: var(--sc-lowest);
    border: 1px solid var(--outline-variant); color: var(--neon);
    font: 700 16px/20px var(--mono); font-variant-numeric: tabular-nums;
  }
  input[type=range] { appearance: none; width: 100%; height: 12px; border-radius: 999px; background: #333; }
  input[type=range]::-webkit-slider-thumb {
    appearance: none; width: 32px; height: 32px; border-radius: 999px; background: var(--neon);
    border: 4px solid var(--bg);
  }
  input[type=range]::-moz-range-thumb {
    width: 32px; height: 32px; border: 4px solid var(--bg); border-radius: 999px; background: var(--neon);
  }
  .row { display: flex; align-items: center; gap: 12px; }
  .row label { flex: 1; font: 500 17px/22px var(--sans); text-transform: uppercase; letter-spacing: .04em; }
  select {
    min-height: 52px; padding: 0 14px; background: var(--sc-high); color: var(--on-surface);
    border: 1px solid var(--outline-variant); border-radius: 2px;
    font: 700 15px/20px var(--mono); text-transform: uppercase;
  }
  .err { color: #ff8a80; margin: 0; font: 700 14px/20px var(--mono); }
</style>
</head>
<body>

<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>

  <!-- live session -->
  <div class="hud">
    <div id="top">
      <div id="exname-wrap">
        <div id="exname" class="headline">—</div>
        <div id="setinfo" class="data">—</div>
      </div>
      <div style="flex:1"></div>
      <button id="btn-settings">Adjust</button>
    </div>

    <div id="reps">
      <div id="repnum">0</div>
      <div id="reptarget" class="data">/ 0</div>
    </div>

    <div style="flex:1"></div>
    <div id="cue"></div>
    <div id="status"></div>

    <div id="bottom">
      <button id="btn-end" class="primary">End set</button>
      <button id="btn-skip">Change lift</button>
    </div>
  </div>

  <!-- today's plan — the landing screen once a profile exists -->
  <section class="sheet" id="sheet-today" hidden>
    <header><div class="brand">Trainer</div></header>
    <div class="body">
      <div>
        <div id="today-day" class="data" style="color:var(--on-surface-variant)">—</div>
        <h1 id="today-name" class="hero" style="margin:6px 0 0">—</h1>
      </div>
      <div id="todaylist" class="exlist"></div>
      <p id="today-note" class="muted data"></p>
    </div>
    <div class="foot">
      <button id="btn-browse">All lifts</button>
      <button id="btn-progress">Progress</button>
      <button id="btn-profile">Profile</button>
    </div>
  </section>

  <!-- progress -->
  <section class="sheet" id="sheet-progress" hidden>
    <header>
      <button id="btn-progress-back" type="button">&larr;</button>
      <div class="brand" style="flex:1;text-align:center;font-size:24px">Progress</div>
      <div style="width:44px"></div>
    </header>
    <div class="body" id="progress-body"></div>
    <div class="foot"><button id="btn-progress-done" class="primary">Done</button></div>
  </section>

  <!-- profile -->
  <section class="sheet" id="sheet-profile" hidden>
    <header>
      <button id="btn-profile-back" type="button">&larr;</button>
      <div class="brand" style="flex:1;text-align:center;font-size:24px">Profile</div>
      <div style="width:44px"></div>
    </header>
    <div class="body">
      <p class="muted">Only what changes the plan. Everything stays on this phone.</p>

      <div class="stepper">
        <label for="in-bw">Bodyweight (kg)</label>
        <div class="ctl">
          <button type="button" data-step="-1" data-for="in-bw">&minus;</button>
          <input type="number" id="in-bw" min="30" max="250" step="1" inputmode="numeric">
          <button type="button" data-step="1" data-for="in-bw">+</button>
        </div>
      </div>

      <div class="stepper">
        <label for="in-days">Training days per week</label>
        <div class="ctl">
          <button type="button" data-step="-1" data-for="in-days">&minus;</button>
          <input type="number" id="in-days" min="2" max="6" step="1" inputmode="numeric">
          <button type="button" data-step="1" data-for="in-days">+</button>
        </div>
      </div>

      <div>
        <label class="fieldlabel" for="p-experience">Experience</label>
        <div class="chips wrap" id="p-experience">
          <button type="button" data-value="beginner">Beginner</button>
          <button type="button" data-value="intermediate">Intermediate</button>
          <button type="button" data-value="advanced">Advanced</button>
        </div>
      </div>

      <div>
        <label class="fieldlabel" for="p-goal">Goal</label>
        <div class="chips wrap" id="p-goal">
          <button type="button" data-value="strength">Strength</button>
          <button type="button" data-value="hypertrophy">Muscle</button>
          <button type="button" data-value="endurance">Endurance</button>
        </div>
      </div>

      <div>
        <label class="fieldlabel" for="p-equipment">Equipment you have</label>
        <div class="chips wrap" id="p-equipment" data-multi></div>
      </div>

      <div>
        <label class="fieldlabel" for="p-injuries">Anything you're nursing</label>
        <div class="chips wrap" id="p-injuries" data-multi></div>
        <p id="profile-warn" class="err"></p>
      </div>
    </div>
    <div class="foot"><button id="btn-save-profile" class="primary">Save</button></div>
  </section>

  <!-- pick a lift -->
  <section class="sheet" id="sheet-picker" hidden>
    <header>
      <button id="btn-picker-back" type="button">&larr;</button>
      <div class="brand" style="flex:1;text-align:center">Trainer</div>
      <div style="width:44px"></div>
    </header>
    <div id="groups"></div>
    <div id="exlist"></div>
    <div id="picker-controls">
      <div id="facing" data-value="environment">
        <button type="button" data-facing="user">Front camera</button>
        <button type="button" data-facing="environment" aria-pressed="true">Rear camera</button>
      </div>
      <label class="switch">
        <span>Voice cues</span>
        <input type="checkbox" id="voice" checked>
      </label>
    </div>
  </section>

  <!-- set it up -->
  <section class="sheet" id="sheet-setup" hidden>
    <header>
      <button id="btn-back" type="button">&larr;</button>
      <div class="brand" style="flex:1;text-align:center">Trainer</div>
      <div style="width:44px"></div>
    </header>
    <div class="body">
      <h1 id="setup-ex" class="hero" style="margin:0">—</h1>
      <div class="hintcard"><span id="setup-hint">—</span></div>
      <p id="setup-last" class="muted data"></p>

      <div class="stepper">
        <label for="in-sets">Sets</label>
        <div class="ctl">
          <button type="button" data-step="-1" data-for="in-sets">&minus;</button>
          <input type="number" id="in-sets" min="1" max="20" step="1" inputmode="numeric">
          <button type="button" data-step="1" data-for="in-sets">+</button>
        </div>
      </div>

      <div class="stepper">
        <label for="in-reps">Reps</label>
        <div class="ctl">
          <button type="button" data-step="-1" data-for="in-reps">&minus;</button>
          <input type="number" id="in-reps" min="1" max="50" step="1" inputmode="numeric">
          <button type="button" data-step="1" data-for="in-reps">+</button>
        </div>
      </div>

      <div class="stepper">
        <label for="in-load">Weight (kg)</label>
        <div class="ctl">
          <button type="button" data-step="-2.5" data-for="in-load">&minus;</button>
          <input type="number" id="in-load" min="0" max="500" step="2.5" inputmode="decimal">
          <button type="button" data-step="2.5" data-for="in-load">+</button>
        </div>
      </div>

      <p id="start-err" class="err"></p>
    </div>
    <div class="foot"><button id="btn-start" class="primary">Start</button></div>
  </section>

  <!-- rest -->
  <section class="sheet" id="sheet-rest" hidden>
    <header><div class="brand">Rest</div></header>
    <div class="body">
      <p id="rest-summary" class="muted data"></p>
      <div id="resttime">0:00</div>
      <div id="restbar"><div id="restfill"></div></div>
    </div>
    <div class="foot"><button id="btn-next" class="primary">Next set</button></div>
  </section>

  <!-- adjust -->
  <section class="sheet" id="sheet-settings" hidden>
    <header>
      <button id="btn-close-settings" type="button">&larr;</button>
      <div class="brand" style="flex:1;text-align:center;font-size:22px">Calibration</div>
      <div style="width:44px"></div>
    </header>
    <div class="body">
      <p class="muted">Thresholds for <b id="set-ex">—</b>. Your proportions and camera angle are not
        the textbook numbers. If it nags at form you know is fine, loosen it. Saved per lift.</p>
      <div class="row">
        <label for="view">Camera view</label>
        <select id="view"><option value="side">Side-on</option><option value="front">Front-on</option></select>
      </div>
      <div id="sliders"></div>
    </div>
    <div class="foot">
      <button id="btn-reset">Reset</button>
      <button class="primary" id="btn-close-settings-2">Done</button>
    </div>
  </section>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
